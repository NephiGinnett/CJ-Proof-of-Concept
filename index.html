<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14110f;
    --panel:#1d1811;
    --panel-raised:#241d14;
    --panel-border:#372c1c;
    --parchment:#e9e0cc;
    --muted:#a89a7d;
    --ember:#c1622f;
    --ember-bright:#dd7a44;
    --gold:#b8923f;
    --thread:#6f5a8a;
    --thread-bright:#9481b5;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(193,98,47,0.06), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(111,90,138,0.07), transparent 50%),
      var(--ink);
    color:var(--parchment);
    font-family:'Inter',sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ember);color:var(--ink);}

  h1,h2,h3,.display{
    font-family:'Spectral',serif;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.14em;
    color:var(--muted);
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Shell ---------- */
  header.shell{
    position:sticky;top:0;z-index:10;
    background:rgba(20,17,15,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--panel-border);
    padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;}
  .brand .mark{color:var(--ember);font-size:1.4rem;}
  .brand h1{font-size:1.3rem;margin:0;}
  nav.crumbs{
    font-family:'JetBrains Mono',monospace;
    font-size:0.78rem;
    color:var(--muted);
  }
  nav.crumbs a:hover{color:var(--ember-bright);}
  .search-box{
    display:flex;align-items:center;gap:8px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 12px;
    min-width:200px;
  }
  .search-box input{
    background:none;border:none;outline:none;
    color:var(--parchment);font-family:'Inter',sans-serif;font-size:0.9rem;
    width:100%;
  }
  .search-box input::placeholder{color:var(--muted);}
  .search-box svg{flex-shrink:0;opacity:0.6;}

  main{max-width:920px;margin:0 auto;padding:32px 24px 80px;}

  /* ---------- Section headers ---------- */
  .section-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin:40px 0 16px;
    border-bottom:1px solid var(--panel-border);
    padding-bottom:8px;
  }
  .section-head:first-child{margin-top:0;}
  .section-head h2{font-size:1.1rem;margin:0;color:var(--parchment);}
  .section-head .count{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--muted);}

  /* ---------- Card grid (the "index card" look) ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:2px;
    padding:16px 16px 14px;
    transition:transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute;top:0;left:0;right:0;height:3px;
    background:var(--ember);
    transform:scaleX(0);transform-origin:left;
    transition:transform 0.2s ease;
  }
  .card:hover{transform:translateY(-2px);border-color:var(--ember);background:var(--panel-raised);}
  .card:hover::before{transform:scaleX(1);}
  /* stretched link: covers the whole card, sits under the tag pills so those stay clickable */
  .card .card-link{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1;}
  .card .card-link:focus-visible{outline:2px solid var(--ember-bright);outline-offset:-3px;}
  .card .tag-row{position:relative;z-index:2;}
  .card .kind{
    font-family:'JetBrains Mono',monospace;font-size:0.65rem;
    text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);
    display:block;margin-bottom:6px;
  }
  .card .name{font-family:'Spectral',serif;font-size:1.15rem;font-weight:600;display:block;margin-bottom:4px;}
  .card .sub{font-size:0.82rem;color:var(--muted);margin:0 0 8px;}
  .card .snippet{font-size:0.85rem;color:var(--parchment);opacity:0.85;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;}
  .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}

  .tag{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:0.68rem;
    padding:3px 8px;
    border:1px solid var(--panel-border);
    border-radius:20px;
    color:var(--gold);
    background:rgba(184,146,63,0.06);
  }
  .tag:hover{border-color:var(--gold);background:rgba(184,146,63,0.14);}
  .tag.empty-state{color:var(--muted);border-style:dashed;}

  /* ---------- Detail page ---------- */
  .detail-header{
    display:flex;gap:20px;align-items:flex-start;margin-bottom:20px;
  }
  .detail-header img{
    width:96px;height:96px;object-fit:cover;border:1px solid var(--panel-border);
    background:var(--panel);flex-shrink:0;
  }
  .detail-header h1{font-size:2rem;margin:0 0 6px;}
  .detail-meta{font-size:0.85rem;color:var(--muted);}
  .detail-meta a{color:var(--ember-bright);}
  .detail-meta a:hover{text-decoration:underline;}
  .bio{
    background:var(--panel);border:1px solid var(--panel-border);
    border-left:3px solid var(--ember);
    padding:16px 18px;margin:20px 0;font-size:0.95rem;
  }
  .bio.empty{color:var(--muted);font-style:italic;}

  /* ---------- Relationship thread board ---------- */
  .thread-board{
    position:relative;
    background:var(--panel);
    border:1px solid var(--panel-border);
    padding:28px 20px;
    margin:16px 0;
    overflow:visible;
  }
  .thread-board svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  .thread-board .pin{
    position:relative;z-index:2;
    display:inline-flex;flex-direction:column;align-items:center;
    text-align:center;width:110px;
  }
  .thread-board .center-pin{width:130px;}
  .thread-board .node{
    width:14px;height:14px;border-radius:50%;
    background:var(--ember);
    box-shadow:0 0 0 4px rgba(193,98,47,0.15);
    margin-bottom:8px;
  }
  .thread-board .center-pin .node{background:var(--gold);box-shadow:0 0 0 5px rgba(184,146,63,0.18);}
  .thread-board .pin .lbl{font-family:'Spectral',serif;font-size:0.95rem;}
  .thread-board .pin .rel-label{
    font-family:'JetBrains Mono',monospace;font-size:0.65rem;color:var(--thread-bright);
    text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;
  }
  .thread-row{display:flex;justify-content:center;align-items:center;gap:40px;flex-wrap:wrap;position:relative;z-index:2;}

  /* ---------- Tag cloud ---------- */
  .tag-cloud{display:flex;flex-wrap:wrap;gap:8px;}

  /* ---------- Search ---------- */
  .search-results .card{margin-bottom:0;}
  .empty-note{color:var(--muted);font-style:italic;padding:20px 0;}

  /* ---------- Add-entry builder ---------- */
  .type-tabs{display:flex;gap:8px;margin:18px 0 24px;flex-wrap:wrap;}
  .type-tab{
    font-family:'JetBrains Mono',monospace;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;
    padding:8px 16px;border:1px solid var(--panel-border);border-radius:20px;
    color:var(--muted);cursor:pointer;background:var(--panel);
  }
  .type-tab:hover{border-color:var(--gold);color:var(--parchment);}
  .type-tab.active{background:var(--ember);border-color:var(--ember);color:var(--ink);font-weight:600;}

  .builder-grid{display:grid;grid-template-columns:1fr;gap:24px;}
  @media (min-width:820px){ .builder-grid{grid-template-columns:1fr 1fr;} }

  .field{margin-bottom:16px;}
  .field label{
    display:block;font-family:'JetBrains Mono',monospace;font-size:0.72rem;
    text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:6px;
  }
  .field .hint{font-size:0.75rem;color:var(--muted);margin-top:4px;font-style:italic;}
  .field input[type=text], .field input[type=password], .field textarea{
    width:100%;background:var(--panel);border:1px solid var(--panel-border);
    color:var(--parchment);font-family:'Inter',sans-serif;font-size:0.9rem;
    padding:10px 12px;border-radius:2px;outline:none;
  }
  .field input[type=text]:focus, .field input[type=password]:focus, .field textarea:focus{border-color:var(--ember);}
  .field textarea{resize:vertical;min-height:70px;}

  .rel-row{display:flex;gap:8px;margin-bottom:8px;}
  .rel-row input{flex:1;}
  .rel-remove, .rel-add{
    font-family:'JetBrains Mono',monospace;font-size:0.75rem;
    background:var(--panel);border:1px solid var(--panel-border);color:var(--muted);
    border-radius:2px;cursor:pointer;padding:0 10px;
  }
  .rel-remove:hover{border-color:var(--ember);color:var(--ember-bright);}
  .rel-add{padding:8px 14px;color:var(--gold);border-color:var(--panel-border);}
  .rel-add:hover{border-color:var(--gold);}

  .json-preview{
    background:var(--panel);border:1px solid var(--panel-border);border-left:3px solid var(--gold);
    padding:16px;font-family:'JetBrains Mono',monospace;font-size:0.78rem;line-height:1.55;
    white-space:pre-wrap;word-break:break-word;color:var(--parchment);
    max-height:520px;overflow:auto;
  }
  .copy-btn{
    display:inline-flex;align-items:center;gap:8px;margin-top:12px;
    font-family:'JetBrains Mono',monospace;font-size:0.8rem;
    background:var(--ember);color:var(--ink);border:none;border-radius:2px;
    padding:10px 16px;cursor:pointer;font-weight:600;
  }
  .copy-btn:hover{background:var(--ember-bright);}
  .copy-btn.copied{background:var(--gold);}
  .copy-btn[disabled]{opacity:0.45;cursor:not-allowed;}
  .ghost-btn{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'JetBrains Mono',monospace;font-size:0.8rem;font-weight:600;
    background:var(--panel);color:var(--parchment);
    border:1px solid var(--panel-border);border-radius:2px;
    padding:9px 15px;cursor:pointer;
  }
  .ghost-btn:hover{border-color:var(--gold);color:var(--gold);}
  .ghost-btn.copied{background:var(--gold);border-color:var(--gold);color:var(--ink);}

  /* ---------- Upload / preview / publish ---------- */
  #preview-bar{
    position:sticky;top:0;z-index:9;
    background:var(--panel-raised);
    border-bottom:1px solid var(--gold);
    border-left:4px solid var(--gold);
    padding:12px 24px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    font-family:'JetBrains Mono',monospace;font-size:0.8rem;
  }
  #preview-bar .pv-label{color:var(--gold);font-weight:600;letter-spacing:0.06em;text-transform:uppercase;font-size:0.7rem;}
  #preview-bar .pv-detail{color:var(--muted);}
  #preview-bar .pv-warn{color:var(--ember-bright);}
  #preview-bar .pv-spacer{flex:1;}
  #preview-bar button{font-size:0.78rem;padding:8px 14px;}

  .dropzone{
    border:2px dashed var(--panel-border);border-radius:4px;
    background:var(--panel);padding:34px 24px;text-align:center;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .dropzone.over{border-color:var(--gold);background:var(--panel-raised);}
  .dropzone .dz-hint{color:var(--muted);font-size:0.85rem;margin:10px 0 0;}
  .dropzone input[type=file]{display:none;}

  .report{margin:20px 0;}
  .report .line{
    display:flex;gap:10px;align-items:flex-start;
    border:1px solid var(--panel-border);border-top:none;
    background:var(--panel);padding:9px 14px;font-size:0.86rem;
  }
  .report .line:first-child{border-top:1px solid var(--panel-border);}
  .report .flag{
    font-family:'JetBrains Mono',monospace;font-size:0.62rem;font-weight:600;letter-spacing:0.1em;
    padding:3px 7px;border-radius:2px;flex-shrink:0;color:var(--ink);
  }
  .flag.ok{background:#6f9a52;}
  .flag.warn{background:var(--gold);}
  .flag.err{background:#c9483f;color:#fff;}

  .panel{
    background:var(--panel);border:1px solid var(--panel-border);
    border-left:3px solid var(--panel-border);padding:18px 20px;margin:20px 0;
  }
  .panel.gold{border-left-color:var(--gold);}
  .panel h3{margin:0 0 10px;font-size:1rem;}
  .panel .note{color:var(--muted);font-size:0.82rem;max-width:65ch;}
  .field-row{display:flex;gap:12px;flex-wrap:wrap;}
  .field-row .field{flex:1;min-width:150px;}
  details.help{margin-top:12px;}
  details.help summary{cursor:pointer;color:var(--gold);font-size:0.82rem;font-family:'JetBrains Mono',monospace;}
  details.help .note{margin-top:10px;}
  details.help ol{color:var(--muted);font-size:0.82rem;max-width:65ch;padding-left:20px;}
  .status-line{margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:0.8rem;}
  .status-line.good{color:#8fbf6c;}
  .status-line.bad{color:#e79b94;}
  .builder-note{color:var(--muted);font-size:0.82rem;max-width:60ch;margin:4px 0 0;}

  footer{
    max-width:920px;margin:0 auto;padding:20px 24px 60px;
    color:var(--muted);font-size:0.78rem;font-family:'JetBrains Mono',monospace;
    border-top:1px solid var(--panel-border);
  }

  @media (max-width:600px){
    header.shell{padding:12px 16px;}
    main{padding:24px 16px 60px;}
    .detail-header{flex-direction:column;}
    .thread-row{gap:20px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;scroll-behavior:auto !important;}
  }
</style>
</head>
<body>

<header class="shell">
  <div class="brand" onclick="location.hash='#/'">
    <span class="mark">&#10038;</span>
    <h1>The Archive</h1>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="global-search" type="text" placeholder="Search players, OCs, stories, tags&hellip;" />
    </div>
    <a href="#/upload" class="ghost-btn" style="margin:0;white-space:nowrap;">&#8593; Upload</a>
    <a href="#/add/player" class="copy-btn" style="margin:0;white-space:nowrap;">+ Add entry</a>
  </div>
</header>

<div id="preview-bar" hidden></div>

<main id="app"></main>

<footer>
  the archive &mdash; data lives in <span class="mono">/data/*.json</span>. Upload a file to preview it, publish when it looks right.
</footer>

<script>
/* ============================================================
   DATA LAYER
   ============================================================ */
let DB = { players: [], ocs: [], stories: [] };

/* PUBLISHED is what's actually committed in data/*.json.
   PENDING holds uploaded-but-not-yet-published collections, if any.
   DB is what the site renders: PUBLISHED with PENDING laid over the top. */
let PUBLISHED = { players: [], ocs: [], stories: [] };
let PENDING = null;

const COLLECTIONS = ['players', 'ocs', 'stories'];
const COLLECTION_FOR_TYPE = { player: 'players', oc: 'ocs', story: 'stories' };
const PENDING_KEY = 'archive:pending';
const CONFIG_KEY  = 'archive:publish-config';
const TOKEN_KEY   = 'archive:github-token';

async function loadData(){
  const [players, ocs, stories] = await Promise.all([
    fetch('data/players.json').then(r => r.json()),
    fetch('data/ocs.json').then(r => r.json()),
    fetch('data/stories.json').then(r => r.json())
  ]);
  PUBLISHED = { players, ocs, stories };
  PENDING = readPending();
  applyDB();
}

function applyDB(){
  // slice: DB gets its own arrays, so mutating DB can never edit the published
  // baseline we fall back to when an upload is discarded
  DB = {};
  COLLECTIONS.forEach(k => {
    const src = (PENDING && PENDING[k]) || PUBLISHED[k] || [];
    DB[k] = src.slice();
  });
}

function readPending(){
  try{
    const raw = sessionStorage.getItem(PENDING_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    const kept = {};
    COLLECTIONS.forEach(k => { if(Array.isArray(obj[k])) kept[k] = obj[k]; });
    return Object.keys(kept).length ? kept : null;
  }catch(e){ return null; }
}

function setPending(next){
  PENDING = next && Object.keys(next).length ? next : null;
  try{
    if(PENDING) sessionStorage.setItem(PENDING_KEY, JSON.stringify(PENDING));
    else sessionStorage.removeItem(PENDING_KEY);
  }catch(e){ /* private browsing — preview still works for this page view */ }
  applyDB();
}

const byId = (arr, id) => arr.find(x => x.id === id);

function allTags(){
  const set = new Set();
  DB.ocs.forEach(o => (o.tags||[]).forEach(t => set.add(t)));
  DB.stories.forEach(s => (s.tags||[]).forEach(t => set.add(t)));
  return [...set].sort();
}

/* ============================================================
   TEMPLATES / HELPERS
   ============================================================ */
const esc = (s='') => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tagPills(tags){
  if(!tags || !tags.length) return `<span class="tag empty-state">no tags</span>`;
  return tags.map(t => `<a class="tag" href="#/tag/${esc(t)}">#${esc(t)}</a>`).join('');
}

function cardHTML(kind, item, subLabel, snippet){
  // the whole card is clickable via a stretched overlay link rather than by wrapping
  // the card in an <a> — the tag pills are links too, and nesting <a> inside <a> is
  // invalid HTML that browsers "repair" by tearing the card apart.
  const label = esc(item.name || item.title);
  return `
    <div class="card">
      <a class="card-link" href="#/${kind}/${esc(item.id)}" aria-label="${label}"></a>
      <span class="kind">${kind}</span>
      <span class="name">${label}</span>
      ${subLabel ? `<p class="sub">${subLabel}</p>` : ''}
      ${snippet ? `<p class="snippet">${esc(snippet)}</p>` : ''}
      <div class="tag-row">${tagPills(item.tags)}</div>
    </div>`;
}

function sectionHTML(title, count, bodyHTML){
  return `
    <div class="section-head"><h2>${title}</h2><span class="count">${count}</span></div>
    ${bodyHTML}`;
}

/* ============================================================
   VIEWS
   ============================================================ */
function viewHome(){
  const players = DB.players.map(p => {
    const n = DB.ocs.filter(o => o.playerId === p.id).length;
    return cardHTML('player', p, `${n} OC${n===1?'':'s'}`, p.bio);
  });
  const ocs = DB.ocs.map(o => {
    const player = byId(DB.players, o.playerId);
    return cardHTML('oc', o, player ? 'played by ' + esc(player.name) : '', o.bio);
  });
  const stories = DB.stories.map(s =>
    cardHTML('story', s, `${(s.ocIds||[]).length} in the cast`, s.summary));

  const tags = allTags().map(t => `<a class="tag" href="#/tag/${esc(t)}">#${esc(t)}</a>`).join('');

  return `
    <div class="eyebrow">the archive &mdash; players &middot; original characters &middot; stories</div>
    <h1 style="font-size:2.1rem;margin:6px 0 4px;">Every thread, in one place</h1>
    <p style="color:var(--muted);max-width:60ch;">Browse by player, OC, or story below, or jump straight to a tag. Everything cross-links automatically.</p>

    ${sectionHTML('Tags', allTags().length, `<div class="tag-cloud">${tags || '<span class="tag empty-state">no tags yet</span>'}</div>`)}
    ${sectionHTML('Players', DB.players.length, `<div class="grid">${players.join('') || emptyNote('No players yet.')}</div>`)}
    ${sectionHTML('OCs', DB.ocs.length, `<div class="grid">${ocs.join('') || emptyNote('No OCs yet.')}</div>`)}
    ${sectionHTML('Stories', DB.stories.length, `<div class="grid">${stories.join('') || emptyNote('No stories yet.')}</div>`)}
  `;
}

function emptyNote(msg){ return `<p class="empty-note">${msg}</p>`; }

function viewPlayer(id){
  const p = byId(DB.players, id);
  if(!p) return notFound('player', id);
  const ocs = DB.ocs.filter(o => o.playerId === id);
  return `
    <div class="detail-header">
      ${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.name)}">` : ''}
      <div>
        <div class="eyebrow">player</div>
        <h1>${esc(p.name)}</h1>
        <div class="detail-meta">${ocs.length} OC${ocs.length===1?'':'s'}</div>
      </div>
    </div>
    <div class="bio ${p.bio ? '' : 'empty'}">${p.bio ? esc(p.bio) : 'No bio yet.'}</div>
    ${sectionHTML('OCs played', ocs.length, `<div class="grid">${
      ocs.map(o => cardHTML('oc', o, '', o.bio)).join('') || emptyNote('No OCs linked to this player yet.')
    }</div>`)}
  `;
}

function viewOC(id){
  const o = byId(DB.ocs, id);
  if(!o) return notFound('oc', id);
  const player = byId(DB.players, o.playerId);
  const stories = DB.stories.filter(s => (o.storyIds||[]).includes(s.id));
  const rels = (o.relationships||[]).map(r => ({...r, target: byId(DB.ocs, r.ocId)})).filter(r => r.target);

  return `
    <div class="detail-header">
      ${o.image ? `<img src="${esc(o.image)}" alt="${esc(o.name)}">` : ''}
      <div>
        <div class="eyebrow">original character</div>
        <h1>${esc(o.name)}</h1>
        <div class="detail-meta">${player ? `played by <a href="#/player/${esc(player.id)}">${esc(player.name)}</a>` : 'no player linked'}</div>
      </div>
    </div>
    <div class="bio ${o.bio ? '' : 'empty'}">${o.bio ? esc(o.bio) : 'No bio yet.'}</div>
    <div class="tag-row">${tagPills(o.tags)}</div>

    ${sectionHTML('Relationships', rels.length, rels.length ? threadBoard(o, rels) : emptyNote('No relationships recorded yet.'))}

    }</div>`)}
  `;
}

function threadBoard(center, rels){

  const pins = rels.map((r,i) => `

function viewStory(id){

      cast.map(o => cardHTML('oc', o, '', o.bio)).join('') || emptyNote('No cast linked yet.')
    }</div>`)}

function viewTag(tag){
  const ocs = DB.ocs.filter(o => (o.tags||[]).includes(tag));
  const stories = DB.stories.filter(s => (s.tags||[]).includes(tag));
  return `
    <div class="eyebrow">tag</div>
    <h1 style="font-size:1.8rem;">#${esc(tag)}</h1>
    ${sectionHTML('OCs', ocs.length, `<div class="grid">${ocs.map(o=>cardHTML('oc',o,'',o.bio)).join('') || emptyNote('No OCs with this tag.')}</div>`)}
    ${sectionHTML('Stories', stories.length, `<div class="grid">${stories.map(s=>cardHTML('story',s,'',s.summary)).join('') || emptyNote('No stories with this tag.')}</div>`)}
  `;
}

function viewSearch(query){
  const q = query.trim().toLowerCase();
  const results = [];
  DB.players.forEach(p => { if(matches(p,q)) results.push(cardHTML('player',p,'',p.bio)); });
  DB.ocs.forEach(o => { if(matches(o,q)) results.push(cardHTML('oc',o,'',o.bio)); });
  DB.stories.forEach(s => { if(matches(s,q,'title')) results.push(cardHTML('story',s,'',s.summary)); });

  return `
    <div class="eyebrow">search</div>
    <h1 style="font-size:1.8rem;">Results for &ldquo;${esc(query)}&rdquo;</h1>
    <div class="grid search-results">${results.join('') || emptyNote('Nothing matched. Try a different name or tag.')}</div>
  `;
}

function matches(item, q, nameField='name'){
  if(!q) return false;
  const hay = [
    item[nameField] || '',
    item.bio || item.summary || '',
    ...(item.tags||[])
  ].join(' ').toLowerCase();
  return hay.includes(q);
}

function bindAddForm(type){

  function addRelRow(ocId='', label=''){

      <input type="text" class="rel-ocid" placeholder="oc id" value="${ocId}">

      obj = { id: slugify(val('f-name')) || 'your-oc-id', name: val('f-name') || 'Display Name',

        bio: val('f-bio'), image: val('f-image'),
        tags: listFromCSV(val('f-tags')), storyIds: listFromCSV(val('f-storyids')).map(slugify),
        relationships: rels };
    } else {
      obj = { id: slugify(val('f-name')) || 'your-story-id', title: val('f-name') || 'Story Title',
        summary: val('f-bio'), date: val('f-date'), image: val('f-image'),
        ocIds: listFromCSV(val('f-ocids')).map(slugify), tags: listFromCSV(val('f-tags')) };

      btn.classList.add('copied');
    }catch(e){
      btn.textContent = 'Select the text above and copy manually';

    setTimeout(() => { btn.textContent = 'Copy JSON'; btn.classList.remove('copied'); }, 1800);
  });
}

/* ============================================================
   UPLOAD → PREVIEW → PUBLISH
   ============================================================ */
const FILE_LABEL = { players: 'players.json', ocs: 'ocs.json', stories: 'stories.json' };
const KIND_LABEL = { players: 'player', ocs: 'OC', stories: 'story' };
const KIND_PLURAL = { players: 'players', ocs: 'OCs', stories: 'stories' };

/* Which collection is this file? Shape is more reliable than the filename,
   so sniff the first entry and only fall back to the name. */
function classify(filename, data){
  const first = (Array.isArray(data) && data[0]) || null;
  if(first && typeof first === 'object'){
    if('title' in first) return 'stories';
    if('playerId' in first || 'relationships' in first) return 'ocs';
    if('ocIds' in first) return 'players';
  }
  const n = (filename || '').toLowerCase();
  if(n.includes('player')) return 'players';
  if(n.includes('stor')) return 'stories';
  if(n.includes('oc')) return 'ocs';
  return null;
}

/* Check a candidate database the way a careful reader would.
   Errors block publishing; warnings are worth seeing but won't stop you. */
function validate(db){
  const errors = [], warnings = [], notes = [];
  const ids = { players: [], ocs: [], stories: [] };

  COLLECTIONS.forEach(key => {
    const list = db[key];
    if(!Array.isArray(list)){ errors.push(`${FILE_LABEL[key]} is not a list of entries.`); return; }
    const seen = new Set();
    list.forEach((item, i) => {
      const where = `${FILE_LABEL[key]} entry ${i + 1}`;
      if(!item || typeof item !== 'object'){ errors.push(`${where} is not an object.`); return; }
      if(!item.id){ errors.push(`${where} has no "id".`); return; }
      const nameField = key === 'stories' ? 'title' : 'name';
      if(!item[nameField]) errors.push(`${where} ("${item.id}") has no "${nameField}".`);
      if(seen.has(item.id)) errors.push(`${FILE_LABEL[key]} uses the id "${item.id}" more than once — only the first would be reachable.`);
      seen.add(item.id);
      ids[key].push(item.id);
      if(!/^[a-z0-9-]+$/.test(item.id)) warnings.push(`"${item.id}" in ${FILE_LABEL[key]} has capitals, spaces or symbols in its id — it works, but makes an ugly link.`);
    });
  });
  if(errors.length) return { errors, warnings, notes };

  (db.ocs || []).forEach(o => {
    if(o.playerId && !ids.players.includes(o.playerId))
      warnings.push(`OC "${o.id}" is played by "${o.playerId}", who isn't in players.json — their page will say "no player linked".`);
    (o.storyIds || []).forEach(sid => {
      if(!ids.stories.includes(sid)) warnings.push(`OC "${o.id}" lists story "${sid}", which doesn't exist — it just won't show up.`);
    });
    (o.relationships || []).forEach(r => {
      if(!r || !r.ocId) return warnings.push(`OC "${o.id}" has a relationship with no "ocId".`);
      if(!ids.ocs.includes(r.ocId)) warnings.push(`OC "${o.id}" has a relationship with "${r.ocId}", who doesn't exist — it won't be drawn.`);
    });
  });
  (db.stories || []).forEach(s => (s.ocIds || []).forEach(oid => {
    if(!ids.ocs.includes(oid)) warnings.push(`Story "${s.id}" casts "${oid}", who doesn't exist — they won't appear in the cast.`);
  }));

  notes.push(`${ids.players.length} player${ids.players.length === 1 ? '' : 's'}, ${ids.ocs.length} OC${ids.ocs.length === 1 ? '' : 's'}, ${ids.stories.length} stor${ids.stories.length === 1 ? 'y' : 'ies'}.`);
  return { errors, warnings, notes };
}

/* ---------- the sticky "you're previewing" bar ---------- */
function renderPreviewBar(){
  const bar = document.getElementById('preview-bar');
  if(!PENDING){ bar.hidden = true; bar.innerHTML = ''; return; }

  const changed = Object.keys(PENDING).map(k => FILE_LABEL[k]).join(', ');

  const trouble = errors.length
    ? `<span class="pv-warn">${errors.length} problem${errors.length === 1 ? '' : 's'} &mdash; can't publish yet</span>`
    : warnings.length
      ? `<span class="pv-warn">${warnings.length} thing${warnings.length === 1 ? '' : 's'} to check</span>`
      : '';

  bar.hidden = false;
  bar.innerHTML = `
    <span class="pv-label">Preview &mdash; not published</span>
    <span class="pv-detail">${esc(changed)}</span>
    ${trouble}
    <span class="pv-spacer"></span>
    <a class="ghost-btn" href="#/upload">Review</a>
    <button class="copy-btn" id="pv-publish" ${errors.length ? 'disabled' : ''}>Publish</button>
    <button class="ghost-btn" id="pv-discard">Discard</button>`;

  const pub = document.getElementById('pv-publish');
  if(pub) pub.addEventListener('click', () => { location.hash = '#/upload'; setTimeout(startPublish, 60); });
  document.getElementById('pv-discard').addEventListener('click', discardPending);
}

function discardPending(){
  setPending(null);
  render();
}

/* ---------- publish target ---------- */
function detectRepo(){
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
  if(m){
    const seg = location.pathname.split('/').filter(Boolean)[0];
    return { owner: m[1], repo: seg || `${m[1]}.github.io`, branch: 'main' };
  }
  return { owner: '', repo: '', branch: 'main' };
}
function getConfig(){
  let saved = {};
  try{ saved = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}'); }catch(e){}
  const auto = detectRepo();
  return { owner: saved.owner || auto.owner, repo: saved.repo || auto.repo, branch: saved.branch || auto.branch };
}
function saveConfig(cfg){ try{ localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); }catch(e){} }
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } }
function saveToken(t){ try{ t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); }catch(e){} }

const b64 = str => {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin);
};

async function gh(path, token, options = {}){
  const res = await fetch(`https://api.github.com${path}`, {
    ...options,
    headers: {
      'Accept': 'application/vnd.github+json',
      'Authorization': `Bearer ${token}`,
      'X-GitHub-Api-Version': '2022-11-28',
      ...(options.body ? { 'Content-Type': 'application/json' } : {})
    }
  });
  return res;
}

function friendlyError(res, body, cfg, path){
  if(res.status === 401) return 'GitHub rejected the token. It may be expired, or pasted with a character missing.';
  if(res.status === 403) return 'GitHub refused the write. The token is probably missing "Contents: Read and write" for this repository.';
  if(res.status === 404) return `GitHub can't see ${cfg.owner}/${cfg.repo} at ${path} on branch "${cfg.branch}". Check the owner, repo and branch above — and that the token has access to this repository.`;
  if(res.status === 409 || res.status === 422) return 'That file changed on GitHub while you were editing. Reload the page and upload again so you start from the current version.';
  return `GitHub said ${res.status}: ${(body && body.message) || 'unknown error'}`;
}

let PUBLISH_RESULT = null;   // set once a publish lands, so the upload page can report it

async function startPublish(){
  const status = document.getElementById('publish-status');
  PUBLISH_RESULT = null;
  const btn = document.getElementById('publish-btn');
  if(!status || !btn) return;

  if(!PENDING) return setStatus(status, 'bad', 'Nothing to publish — upload a file first.');
  const { errors } = validate(DB);
  if(errors.length) return setStatus(status, 'bad', "There are problems to fix before this can be published.");

  const cfg = {
    owner: (document.getElementById('cfg-owner').value || '').trim(),
    repo: (document.getElementById('cfg-repo').value || '').trim(),
    branch: (document.getElementById('cfg-branch').value || '').trim() || 'main'
  };
  const token = (document.getElementById('cfg-token').value || '').trim();
  if(!cfg.owner || !cfg.repo) return setStatus(status, 'bad', 'Fill in the repository owner and name first.');
  if(!token) return setStatus(status, 'bad', 'Paste a GitHub token first — see "How do I get a token?" below.');
  saveConfig(cfg);
  saveToken(token);

  btn.disabled = true;
  const done = [];
  try{
    for(const key of Object.keys(PENDING)){
      const path = `data/${FILE_LABEL[key]}`;
      const content = JSON.stringify(PENDING[key], null, 2) + '\n';
      setStatus(status, '', `Publishing ${path}…`);

      const getRes = await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${path}?ref=${encodeURIComponent(cfg.branch)}`, token);
      let sha;
      if(getRes.ok){
        const cur = await getRes.json();
        sha = cur.sha;
      }else if(getRes.status !== 404){
        const body = await getRes.json().catch(() => ({}));
        throw new Error(friendlyError(getRes, body, cfg, path));
      }

      const putRes = await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, token, {
        method: 'PUT',
        body: JSON.stringify({
          message: `Update ${path} from the archive`,
          content: b64(content),
          branch: cfg.branch,
          ...(sha ? { sha } : {})
        })
      });
      if(!putRes.ok){
        const body = await putRes.json().catch(() => ({}));
        throw new Error(friendlyError(putRes, body, cfg, path));
      }
      const result = await putRes.json();
      done.push({ path, url: result.commit && result.commit.html_url });
      PUBLISHED[key] = PENDING[key];
    }

    // the publish panel disappears with PENDING, so the result is rendered by viewUpload instead
    PUBLISH_RESULT = done;
    setPending(null);
    render();
  }catch(err){
    setStatus(document.getElementById('publish-status'), 'bad', err.message);
    const b = document.getElementById('publish-btn');
    if(b) b.disabled = false;
  }
}

function setStatus(el, kind, msg){
  if(!el) return;
  el.className = 'status-line' + (kind ? ' ' + kind : '');
  el.textContent = msg;
}

function downloadPending(){
  if(!PENDING) return;
  Object.keys(PENDING).forEach(key => {
    const blob = new Blob([JSON.stringify(PENDING[key], null, 2) + '\n'], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = FILE_LABEL[key];
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
}

/* ---------- the upload page ---------- */
function viewUpload(){
  const cfg = getConfig();
  const { errors, warnings, notes } = PENDING ? validate(DB) : { errors: [], warnings: [], notes: [] };

  const reportHTML = !PENDING ? '' : `
    <div class="report">
      ${notes.map(n => `<div class="line"><span class="flag ok">LOADED</span><span>${esc(n)}</span></div>`).join('')}
      ${errors.map(e => `<div class="line"><span class="flag err">FIX</span><span>${esc(e)}</span></div>`).join('')}
      ${warnings.map(w => `<div class="line"><span class="flag warn">CHECK</span><span>${esc(w)}</span></div>`).join('')}
      ${!errors.length && !warnings.length ? `<div class="line"><span class="flag ok">OK</span><span>Every cross-link points at something that exists.</span></div>` : ''}
    </div>`;

  const loaded = PENDING ? Object.keys(PENDING).map(k => `${FILE_LABEL[k]} (${PENDING[k].length} ${PENDING[k].length === 1 ? KIND_LABEL[k] : KIND_PLURAL[k]})`).join(' &middot; ') : '';

  const publishedHTML = (!PENDING && PUBLISH_RESULT && PUBLISH_RESULT.length) ? `
    <div class="panel gold">
      <h3>Published</h3>
      <p class="note">
        ${PUBLISH_RESULT.map(d => d.url
          ? `<a href="${esc(d.url)}" target="_blank" rel="noopener" style="color:var(--ember-bright);">${esc(d.path)}</a>`
          : esc(d.path)).join(', ')}
        &mdash; committed to the repository. GitHub Pages usually catches up within a minute, and the
        site is already showing the new data.
      </p>
    </div>` : '';

  return `
    <div class="eyebrow">upload</div>
    <h1 style="font-size:1.8rem;margin:6px 0 4px;">Upload a data file</h1>
    <p style="color:var(--muted);max-width:60ch;">
      Drop in <span class="mono">players.json</span>, <span class="mono">ocs.json</span> or
      <span class="mono">stories.json</span> &mdash; any or all three. Nothing is saved yet: you get to
      look around the site with your file loaded, and publish it only if it looks right.
    </p>

    <div class="dropzone" id="dropzone">
      <button type="button" class="copy-btn" id="pick-btn" style="margin:0;">Choose files</button>
      <p class="dz-hint">or drag them here</p>
      <input type="file" id="file-input" accept=".json,application/json" multiple>
    </div>
    <div class="status-line" id="upload-status"></div>
    ${publishedHTML}

    ${!PENDING ? '' : `
      <div class="panel gold">
        <h3>Loaded and ready to look at</h3>
        <p class="note">${loaded}</p>
        ${reportHTML}
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;">
          <a class="copy-btn" href="#/" style="margin:0;">Look around the site</a>
          <button type="button" class="ghost-btn" id="discard-btn">Discard</button>
        </div>
      </div>

      <div class="panel ${errors.length ? '' : 'gold'}">
        <h3>Publish to GitHub</h3>
        <p class="note">
          This writes the file straight into your repository, the same as committing it by hand.
          GitHub Pages picks it up within a minute or so.
        </p>
        <div class="field-row" style="margin-top:14px;">
          <div class="field"><label>Owner</label><input type="text" id="cfg-owner" value="${esc(cfg.owner)}" placeholder="your-github-username"></div>
          <div class="field"><label>Repository</label><input type="text" id="cfg-repo" value="${esc(cfg.repo)}" placeholder="repo-name"></div>
          <div class="field"><label>Branch</label><input type="text" id="cfg-branch" value="${esc(cfg.branch)}" placeholder="main"></div>
        </div>
        <div class="field">
          <label>GitHub token</label>
          <input type="password" id="cfg-token" value="${esc(getToken())}" placeholder="github_pat_&hellip;" autocomplete="off">
          <p class="hint">Kept in this browser only &mdash; never in the repo, never sent anywhere but GitHub.</p>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
          <button type="button" class="copy-btn" id="publish-btn" style="margin:0;" ${errors.length ? 'disabled' : ''}>Publish</button>
          <button type="button" class="ghost-btn" id="download-btn">Download the file instead</button>
          <button type="button" class="ghost-btn" id="forget-token-btn">Forget token</button>
        </div>
        <div class="status-line" id="publish-status">${errors.length ? 'Fix the problems above first.' : ''}</div>

        <details class="help">
          <summary>How do I get a token?</summary>
          <ol>
            <li>On GitHub, go to Settings &rarr; Developer settings &rarr; Personal access tokens &rarr; Fine-grained tokens.</li>
            <li>Generate a new token, and under "Repository access" pick only this repository.</li>
            <li>Under "Permissions &rarr; Repository permissions", set <strong>Contents</strong> to <strong>Read and write</strong>. Nothing else is needed.</li>
            <li>Copy it and paste it above. It's stored in this browser and nowhere else.</li>
          </ol>
          <p class="note">
            Anyone using this browser profile can publish with it, and anyone you give the token to can
            write to the repo &mdash; so don't paste it on a shared computer, and don't hand it to other
            players. If you'd rather not use one at all, "Download the file instead" gives you the finished
            file to drag onto GitHub yourself.
          </p>
        </details>
      </div>`}
  `;
}

function bindUpload(){
  const input = document.getElementById('file-input');
  const zone = document.getElementById('dropzone');
  const status = document.getElementById('upload-status');

  document.getElementById('pick-btn').addEventListener('click', () => input.click());
  input.addEventListener('change', () => handleFiles([...input.files]));

  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('over'); }));
  zone.addEventListener('drop', e => handleFiles([...(e.dataTransfer ? e.dataTransfer.files : [])]));

  async function handleFiles(files){
    if(!files.length) return;
    const next = { ...(PENDING || {}) };
    const problems = [];

    for(const file of files){
      let text;
      try{ text = await file.text(); }
      catch(e){ problems.push(`Couldn't read ${file.name}.`); continue; }

      let data;
      try{ data = JSON.parse(text); }
      catch(e){ problems.push(`${file.name} isn't valid JSON — ${e.message}`); continue; }

      if(!Array.isArray(data)){ problems.push(`${file.name} should be a list of entries, starting with [ and ending with ].`); continue; }

      const key = classify(file.name, data);
      if(!key){ problems.push(`Couldn't tell what ${file.name} is. Name it players.json, ocs.json or stories.json.`); continue; }
      next[key] = data;
    }

    if(Object.keys(next).length) setPending(next);
    render();

    const s = document.getElementById('upload-status');
    if(problems.length) setStatus(s, 'bad', problems.join(' '));
    else if(s) setStatus(s, 'good', 'Loaded. Have a look around, then publish if it looks right.');
  }

  if(PENDING){
    document.getElementById('discard-btn').addEventListener('click', discardPending);
    document.getElementById('publish-btn').addEventListener('click', startPublish);
    document.getElementById('download-btn').addEventListener('click', downloadPending);
    document.getElementById('forget-token-btn').addEventListener('click', () => {
      saveToken('');
      document.getElementById('cfg-token').value = '';
      setStatus(document.getElementById('publish-status'), '', 'Token forgotten on this device.');
    });
  }
}

/* ============================================================
   ROUTER
   ============================================================ */
function render(){
  const hash = location.hash || '#/';
  const parts = hash.replace(/^#\//,'').split('/').filter(Boolean);
  const app = document.getElementById('app');

  if(parts.length === 0){
    app.innerHTML = viewHome();
  } else if(parts[0] === 'player' && parts[1]){
    app.innerHTML = viewPlayer(decodeURIComponent(parts[1]));
  } else if(parts[0] === 'oc' && parts[1]){
    app.innerHTML = viewOC(decodeURIComponent(parts[1]));
  } else if(parts[0] === 'story' && parts[1]){
    app.innerHTML = viewStory(decodeURIComponent(parts[1]));
  } else if(parts[0] === 'tag' && parts[1]){
    app.innerHTML = viewTag(decodeURIComponent(parts[1]));
  } else if(parts[0] === 'search' && parts[1]){
    app.innerHTML = viewSearch(decodeURIComponent(parts[1]));
  } else if(parts[0] === 'add'){
    const type = parts[1] || 'player';
    app.innerHTML = viewAdd(type);
    bindAddForm(type);
  } else if(parts[0] === 'upload'){
    app.innerHTML = viewUpload();
    bindUpload();
  } else {
    app.innerHTML = notFound('page', parts.join('/'));
  }
  renderPreviewBar();
  window.scrollTo(0,0);
}

window.addEventListener('hashchange', render);

const searchInput = document.getElementById('global-search');
let searchTimer;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(() => {
    if(val.trim()) location.hash = '#/search/' + encodeURIComponent(val);
    else if(location.hash.startsWith('#/search')) location.hash = '#/';
  }, 200);
});

/* ============================================================
   INIT
   ============================================================ */
loadData().then(render).catch(err => {
  document.getElementById('app').innerHTML = `
    <div class="eyebrow">error</div>
    <h1>Couldn't load the data files</h1>
    <p style="color:var(--muted);">${esc(err.message)}</p>
    <p style="color:var(--muted);">If you opened this file directly (file://), that's the issue &mdash; browsers block JSON fetches from local files. Run a local server, or view it via GitHub Pages.</p>
  `;
});
</script>
</body>
